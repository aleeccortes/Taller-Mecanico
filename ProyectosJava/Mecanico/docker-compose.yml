version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: taller_mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tallermecanico}
      MYSQL_USER: ${DB_USER:-taller}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tallerpass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taller-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Mecanico
      dockerfile: Dockerfile
    container_name: taller_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tallermecanico}
      DB_USER: ${DB_USER:-taller}
      DB_PASSWORD: ${DB_PASSWORD:-tallerpass}
      JWT_SECRET: ${JWT_SECRET:-ClaveSecretaSuperSeguraParaTallerMecanicoJwtToken2026}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taller-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taller_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taller-net

networks:
  taller-net:
    driver: bridge

volumes:
  mysql_data:
