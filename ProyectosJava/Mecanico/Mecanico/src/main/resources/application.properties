spring.application.name=Mecanico

# Configuración de Base de Datos (Soporta variables de entorno en producción/Docker y valores por defecto para desarrollo local)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tallermecanico}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:taller}
spring.datasource.password=${DB_PASSWORD:tallerpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave Secreta JWT configurada por Variable de Entorno con valor por defecto
jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaTallerMecanicoJwtToken2026}

# Configuración del Servidor
server.port=${PORT:8080}
