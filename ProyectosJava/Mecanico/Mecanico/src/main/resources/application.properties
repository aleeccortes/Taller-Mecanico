spring.application.name=Mecanico

# Configuración de Base de Datos (MySQL / H2 Fallback)
# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tallermecanico}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:taller}
spring.datasource.password=${DB_PASSWORD:tallerpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console (Para testing y desarrollo fácil)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Puerto del Servidor
server.port=8080
